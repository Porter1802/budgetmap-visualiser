[project]
name = "atlas-api"
version = "0.4.0"
description = "FastAPI read layer for the QLD Capital Investment Atlas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "duckdb>=0.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_api*"]

# Traefik dynamic config for the Atlas routes on porterble.com.
# Authentik runs a forward-auth outpost; every public route except the tile
# server goes through it. Martin uses a static token instead (forward-auth on
# every tile fetch is too chatty for the map).
http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-outpost:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email

    atlas-tile-token:
      headers:
        # Tile requests carry ?token=… ; validate at the app edge instead.
        customRequestHeaders:
          X-Atlas-Tiles: "1"

  routers:
    atlas-web:
      rule: "Host(`atlas.porterble.com`)"
      service: atlas-web
      middlewares: ["authentik"]
      tls:
        certResolver: letsencrypt

    atlas-api:
      rule: "Host(`atlas-api.porterble.com`)"
      service: atlas-api
      middlewares: ["authentik"]
      tls:
        certResolver: letsencrypt

    atlas-tiles:
      rule: "Host(`atlas-tiles.porterble.com`)"
      service: atlas-tiles
      middlewares: ["atlas-tile-token"]
      tls:
        certResolver: letsencrypt

    atlas-lineage:
      rule: "Host(`atlas-lineage.porterble.com`)"
      service: atlas-lineage
      middlewares: ["authentik"]
      tls:
        certResolver: letsencrypt

  services:
    atlas-web:
      loadBalancer:
        servers:
          - url: "http://atlas-web:80"
    atlas-api:
      loadBalancer:
        servers:
          - url: "http://atlas-api:8000"
    atlas-tiles:
      loadBalancer:
        servers:
          - url: "http://atlas-martin:3000"
    atlas-lineage:
      loadBalancer:
        servers:
          - url: "http://atlas-marquez:5000"

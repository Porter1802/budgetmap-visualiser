# Portainer-friendly stack. Deploy via Portainer → Stacks → paste/Git this file.
services:
  qld-budget-map:
    build: .
    image: qld-budget-map:latest
    container_name: qld-budget-map
    restart: unless-stopped
    # Host port is configurable; defaults to 8080. Override with HOST_PORT
    # (e.g. set HOST_PORT=8090 in Portainer's stack env vars).
    ports:
      - "${HOST_PORT:-8080}:80"
